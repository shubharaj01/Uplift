    <path d="M40 20 L60 -70 C 62 -82 78 -82 82 -70 L96 20" fill="none" stroke="url(#heroHand1)" stroke-width="26" stroke-linecap="round"/>
    <path d="M78 20 L92 -55 C 94 -66 108 -66 111 -55 L120 20" fill="none" stroke="url(#heroHand1)" stroke-width="24" stroke-linecap="round"/>

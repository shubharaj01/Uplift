    <path d="M78 20 L92 -55 C 94 -66 108 -66 111 -55 L120 20" fill="none" stroke="url(#heroHand2)" stroke-width="24" stroke-linecap="round"/>
    <path d="M112 24 L120 -35 C 122 -45 134 -45 137 -35 L142 24" fill="none" stroke="url(#heroHand2)" stroke-width="22" stroke-linecap="round"/>
